services:
  game-engine:
    restart: unless-stopped
    build:
      context: .
      dockerfile: engine_cpp/Dockerfile
    expose:
      - "50051"

  postgres:
    restart: unless-stopped
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  bot:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/bot", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-prod}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-webhook}
      HTTP_ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}   # https://your-domain.tld
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      PAYMENT_SUPPORT_CONTACT: ${PAYMENT_SUPPORT_CONTACT:-}
      BOT_USERNAME: ${BOT_USERNAME}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/tg/webhook}
      DATABASE_URL: ${DATABASE_URL}
      GAME_ENGINE_ADDR: ${GAME_ENGINE_ADDR:-game-engine:50051}
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
      game-engine:
        condition: service_started
    expose:
      - "8080"

  nginx:
    restart: unless-stopped
    image: nginx:1.27
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Сертификаты положи сюда (Let's Encrypt / certbot вне композа или отдельным сервисом)
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - bot

volumes:
  pgdata:

syntax = "proto3";

package catforge.gameengine.v1;

option go_package = "catforge/internal/gen/gameengine/v1;gameenginev1";

service GameEngineService {
  rpc Train(TrainRequest) returns (TrainResponse);
  rpc Expedition(ExpeditionRequest) returns (ExpeditionResponse);
  rpc ResolveYardEvent(ResolveYardEventRequest) returns (ResolveYardEventResponse);
  rpc Fight(FightRequest) returns (FightResponse);
}

message TrainRequest {
  uint32 rules_version = 1;
  CatState cat = 2;
  int64 now_unix_nanos = 3;
  TrainingRandom random = 4;
  uint32 content_version = 5;
}

message TrainResponse {
  CatState cat = 1;
  TrainResult result = 2;
}

message CatState {
  int64 id = 1;
  int64 user_id = 2;
  int64 state_version = 3;
  string name = 4;
  string breed = 5;
  string trait = 6;
  int32 level = 7;
  int64 xp = 8;
  int32 energy = 9;
  optional int64 last_train_at_unix_nanos = 10;
  optional int64 energy_updated_at_unix_nanos = 11;
  int32 hp_base = 12;
  int32 atk_base = 13;
  int32 def_base = 14;
  int32 spd_base = 15;
  int64 coins = 16;
}

message TrainingRandom {
  int32 energy_cost_roll = 1;
  int32 xp_gain_roll = 2;
  int32 encounter_roll = 3;
  uint32 flavor_roll = 4;
}

enum TrainingOutcome {
  TRAINING_OUTCOME_OK = 0;
  TRAINING_OUTCOME_NOT_ENOUGH_ENERGY = 1;
}

enum Encounter {
  ENCOUNTER_UNSPECIFIED = 0;
  ENCOUNTER_MICE_PACK = 1;
  ENCOUNTER_PIGEON = 2;
  ENCOUNTER_LIZARD = 3;
  ENCOUNTER_BIG_RAT = 4;
}

message StatDelta {
  int32 hp = 1;
  int32 atk = 2;
  int32 def = 3;
  int32 spd = 4;
}

message TrainResult {
  TrainingOutcome outcome = 1;
  int64 xp_gain = 2;
  int32 energy_cost = 3;
  bool crit = 4;
  int32 efficiency_percent = 5;
  int32 levels_gained = 6;
  StatDelta stats_gained = 7;
  Encounter encounter = 8;
  uint32 flavor = 9;
  int64 coins_gain = 10;
}

message ExpeditionRequest {
  uint32 rules_version = 1;
  CatState cat = 2;
  int64 now_unix_nanos = 3;
  uint64 seed = 4;
  ExpeditionLocation location = 5;
  ExpeditionDifficulty difficulty = 6;
  uint32 content_version = 7;
  StatDelta equipment_bonus = 8;
  LootCounts loot_counts = 9;
  bool force_loot = 10;
}

message LootCounts {
  int32 common = 1;
  int32 rare = 2;
  int32 epic = 3;
}

message ExpeditionResponse {
  CatState cat = 1;
  ExpeditionResult result = 2;
}

enum ExpeditionOutcome {
  EXPEDITION_OUTCOME_VICTORY = 0;
  EXPEDITION_OUTCOME_DEFEAT = 1;
  EXPEDITION_OUTCOME_NOT_ENOUGH_ENERGY = 2;
}

enum ExpeditionLocation {
  EXPEDITION_LOCATION_UNSPECIFIED = 0;
  EXPEDITION_LOCATION_ALLEY = 1;
  EXPEDITION_LOCATION_ROOFTOP = 2;
  EXPEDITION_LOCATION_PARK = 3;
}

enum ExpeditionDifficulty {
  EXPEDITION_DIFFICULTY_UNSPECIFIED = 0;
  EXPEDITION_DIFFICULTY_EASY = 1;
  EXPEDITION_DIFFICULTY_NORMAL = 2;
  EXPEDITION_DIFFICULTY_HARD = 3;
}

enum EnemyKind {
  ENEMY_KIND_UNSPECIFIED = 0;
  ENEMY_KIND_SEWER_RAT = 1;
  ENEMY_KIND_STRAY_DOG = 2;
  ENEMY_KIND_WILD_LYNX = 3;
  ENEMY_KIND_RAT_ACCOUNTANT = 4;
  ENEMY_KIND_COURIER_DOG = 5;
  ENEMY_KIND_MOON_LYNX = 6;
}

enum BattleActor {
  BATTLE_ACTOR_CAT = 0;
  BATTLE_ACTOR_ENEMY = 1;
}

message Enemy {
  EnemyKind kind = 1;
  int32 level = 2;
  int32 hp = 3;
  int32 atk = 4;
  int32 def = 5;
  int32 spd = 6;
}

message BattleTurn {
  int32 round = 1;
  BattleActor actor = 2;
  int32 damage = 3;
  bool crit = 4;
  int32 defender_hp_after = 5;
}

message ExpeditionResult {
  ExpeditionOutcome outcome = 1;
  Enemy enemy = 2;
  int32 energy_cost = 3;
  int64 xp_gain = 4;
  int32 rounds = 5;
  int32 cat_hp_after = 6;
  int32 enemy_hp_after = 7;
  int32 levels_gained = 8;
  StatDelta stats_gained = 9;
  repeated BattleTurn turns = 10;
  ExpeditionLocation location = 11;
  ExpeditionDifficulty difficulty = 12;
  int64 coins_gain = 13;
  LootRoll loot = 14;
}

enum ItemRarity {
  ITEM_RARITY_UNSPECIFIED = 0;
  ITEM_RARITY_COMMON = 1;
  ITEM_RARITY_RARE = 2;
  ITEM_RARITY_EPIC = 3;
}

message LootRoll {
  bool dropped = 1;
  ItemRarity rarity = 2;
  int32 item_index = 3;
}

enum YardEventType {
  YARD_EVENT_TYPE_UNSPECIFIED = 0;
  YARD_EVENT_TYPE_FISH_TRUCK = 1;
}

enum YardEventChoice {
  YARD_EVENT_CHOICE_UNSPECIFIED = 0;
  YARD_EVENT_CHOICE_STEAL = 1;
  YARD_EVENT_CHOICE_DISTRACT = 2;
  YARD_EVENT_CHOICE_SCOUT = 3;
}

message YardEventParticipant {
  int64 cat_id = 1;
  YardEventChoice choice = 2;
  int32 level = 3;
  int32 hp = 4;
  int32 atk = 5;
  int32 def = 6;
  int32 spd = 7;
}

message ResolveYardEventRequest {
  uint32 rules_version = 1;
  uint32 content_version = 2;
  uint64 seed = 3;
  YardEventType event_type = 4;
  repeated YardEventParticipant participants = 5;
}

message YardEventParticipantResult {
  int64 cat_id = 1;
  YardEventChoice choice = 2;
  int32 contribution = 3;
  int32 fish_reward = 4;
  bool mvp = 5;
}

message ResolveYardEventResponse {
  bool success = 1;
  int32 team_score = 2;
  int32 target_score = 3;
  int32 fish_total = 4;
  bool secret_found = 5;
  int32 strategy_bonus = 6;
  repeated YardEventParticipantResult participants = 7;
  repeated YardRelationshipEffect relationship_effects = 8;
}

message YardRelationshipEffect {
  int64 cat_a_id = 1;
  int64 cat_b_id = 2;
  int32 friendship_delta = 3;
  int32 rivalry_delta = 4;
  int32 respect_delta = 5;
}

message FightRequest {
  uint32 rules_version = 1;
  uint32 content_version = 2;
  uint64 seed = 3;
  CatState cat_a = 4;
  CatState cat_b = 5;
}

message FightTurn {
  int32 round = 1;
  int64 attacker_cat_id = 2;
  int64 defender_cat_id = 3;
  int32 damage = 4;
  bool crit = 5;
  int32 defender_hp_after = 6;
}

message FightResponse {
  int64 winner_cat_id = 1;
  int64 loser_cat_id = 2;
  int32 rounds = 3;
  int32 final_hp_a = 4;
  int32 final_hp_b = 5;
  repeated FightTurn turns = 6;
}

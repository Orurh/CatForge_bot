global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    application: catforge
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: catforge
    static_configs:
      - targets: [bot:9091]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: blackbox
    static_configs:
      - targets: [blackbox:9115]
  - job_name: readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://bot:8080/readyz]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

server {
  listen 80;
  server_name _;

  # Cloudflared terminates TLS; origin is HTTP

  location /tg/webhook {
    proxy_pass http://bot:8080/tg/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /readyz {
    proxy_pass http://bot:8080/readyz;
  }

  location /healthz {
    proxy_pass http://bot:8080/healthz;
  }

  # ВАЖНО: статика
  location /static/ {
    proxy_pass http://bot:8080/static/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    return 200 "ok\n";
  }
}

name: CI and release images

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Build both images and test with PostgreSQL and C++ engine
        run: bash scripts/ci.sh
      - name: Save the verified release images
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          revision="$(git rev-parse HEAD)"
          docker save "catforge-ci-bot:$revision" "catforge-ci-engine:$revision" -o /tmp/catforge-images.tar
          printf '%s\n' "$revision" > /tmp/revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: verified-images
          path: |
            /tmp/catforge-images.tar
            /tmp/revision.txt
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-images
          path: /tmp/release
      - name: Publish exactly the images that passed CI
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          revision="$(cat /tmp/release/revision.txt)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          prefix="ghcr.io/${REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker load -i /tmp/release/catforge-images.tar
          for component in bot engine; do
            destination="$prefix/$component:sha-$revision"
            docker tag "catforge-ci-$component:$revision" "$destination"
            docker push "$destination"
            printf '%s\n' "Published: $destination" >> "$GITHUB_STEP_SUMMARY"
          done
